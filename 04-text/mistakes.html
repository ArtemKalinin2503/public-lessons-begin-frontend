<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибки новичка — так делать не надо</title>
</head>
<body>
  <!-- ✗ Заголовок выбран по размеру: главный заголовок в h4, раздел в h1 -->
  <h4>Кот Пиксель</h4>
  <h1>Режим дня</h1>

  <!-- ✗ Пропущены ступеньки: после h2 сразу h5 -->
  <h2>Любимая еда</h2>
  <h5>Рыба</h5>

  <!-- ✗ Пять br вместо отступа: отступы задают в CSS -->
  <p>Пиксель спит.</p>
  <br><br><br><br><br>
  <p>Пиксель ест.</p>

  <!-- ✗ Выделено всё подряд: важного не осталось -->
  <p><strong>Никогда не будите Пикселя до обеда, он спит, ему тепло, он будет злой.</strong></p>

  <!-- ✗ Кавычки руками плюс q: на странице кавычки двойные -->
  <p>Соседи говорят: <q>«мурчит громче холодильника»</q>.</p>

  <!-- ✗ Скобки без кода: браузер принял <p> за настоящий тег -->
  <p>Используй тег <p> для абзаца.</p>

  <!-- ✗ div внутри p: браузер закроет абзац раньше времени (проверь в DevTools или валидаторе) -->
  <p>Пиксель любит <div>спать</div> и есть.</p>
</body>
</html>
